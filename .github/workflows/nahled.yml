# Náhled konceptu z administrace. Uložený koncept je větev cms/<kolekce>/<název>: sestaví se a jeho data
# se nahrají na web do nahled/<id>/ (tools/nahled.py). Administrace pak u konceptu ukáže „Zobrazit náhled“
# (bere adresu ze stavu commitu „Náhled webu“). Po zveřejnění nebo zahození konceptu se náhled smaže.
name: Náhled konceptu
on:
  push:
    branches: ['cms/**']
  pull_request:
    types: [closed]
  delete:
permissions:
  contents: write
  statuses: write
  pages: write
concurrency:
  group: nahled-${{ github.head_ref || github.event.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
env:
  GH_TOKEN: ${{ github.token }}
  KONTEXT: Náhled webu (preview)
jobs:
  nahled:
    if: github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - name: Oznámit, že se náhled sestavuje
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=pending -f context="$KONTEXT" -f description="Sestavuje se" >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _web
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - run: python tools/build.py
      - name: Připravit a nahrát náhled
        id: nahled
        run: |
          git fetch -q --depth=1 origin main
          ID=$(python tools/nahled.py "${GITHUB_REF_NAME}" _web)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          cd _web
          git config user.name "Náhled konceptu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A nahled
          if git diff --cached --quiet; then echo "beze změn"; exit 0; fi
          git commit -qm "Náhled konceptu $ID"
          for i in 1 2 3 4 5; do git push -q && break; [ $i = 5 ] && exit 1; sleep $((i*3)); git pull -q --rebase origin main; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "nasazení se spustí samo"
      - name: Počkat, až je náhled na webu, a ukázat ho v administraci
        run: |
          WEB=$(gh api "repos/${{ github.repository }}/pages" -q .html_url 2>/dev/null || echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/")
          URL="${WEB%/}/nahled/${{ steps.nahled.outputs.id }}/"
          ZNAK=$(sha1sum _web/nahled/${{ steps.nahled.outputs.id }}/data/web.js | cut -c1-40)
          for i in $(seq 1 40); do
            [ "$(curl -fsSL "${URL}data/web.js?t=$i" | sha1sum | cut -c1-40)" = "$ZNAK" ] && break
            sleep 15
          done
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=success -f context="$KONTEXT" -f description="Náhled je připravený" -f target_url="$URL" >/dev/null
      - name: Oznámit chybu
        if: failure()
        run: gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" -f state=error -f context="$KONTEXT" -f description="Náhled se nepodařilo sestavit" >/dev/null

  uklid:
    if: github.event_name != 'push' || github.event.deleted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Smazat náhledy konceptů, které už neexistují
        run: |
          [ -d nahled ] || exit 0
          ZIVE=$(git ls-remote --heads origin 'cms/*' | sed 's|.*refs/heads/cms/||' | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9-]\{1,\}/-/g; s/^-*//; s/-*$//' | cut -c1-80)
          for d in nahled/*/; do
            id=$(basename "$d")
            echo "$ZIVE" | grep -qx "$id" || git rm -rq "$d"
          done
          git config user.name "Náhled konceptu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then echo "beze změn"; exit 0; fi
          git commit -qm "Smazány náhledy zveřejněných nebo zahozených konceptů"
          for i in 1 2 3 4 5; do git push -q && break; [ $i = 5 ] && exit 1; sleep $((i*3)); git pull -q --rebase origin main; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "nasazení se spustí samo"
