# Po uložení v administraci doplní překlady (tools/preklad.py), přestaví data webu (tools/build.py) a znovu nasadí testovací web.
name: Sestavení webu
on:
  push:
    branches: [main]
    paths: ['content/**', 'img/**', 'i18n/**', 'admin/config.yml', 'tools/build.py', 'tools/preklad.py', 'tools/adresy.py', 'index.html']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow pillow-heif
      - name: Přeložit nové texty do EN a DE (DeepL, jen když je nastaven klíč DEEPL_KEY)
        env:
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
        run: python tools/preklad.py
      - run: python i18n/sestav.py
      - run: python tools/build.py
      - name: Uložit sestavená data
        run: |
          git config user.name "Sestavení webu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content data admin/demo admin/config.yml img index.html sitemap.xml robots.txt
          # stránky s vlastní adresou (tools/adresy.py): nové, změněné i smazané
          git add -A $(python -c "import json;print(' '.join(sorted({p.split('/')[0] for p in json.load(open('data/adresy.json'))['stranky']})))") $(git -c core.quotepath=off ls-files -- '*/index.html' | grep -v '^admin/' | cut -d/ -f1 | sort -u)
          if git diff --cached --quiet; then echo "beze změn"; exit 0; fi
          git commit -m "Sestavení webu po změně v administraci"
          # do main mezitím mohl zapsat jiný běh (náhled konceptu, další uložení) → přidat se za něj a zkusit znovu
          for i in 1 2 3 4 5; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
          done
          exit 1
      - name: Znovu nasadit testovací web
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "nasazení se spustí samo"
