# Nastavení administrace (Sveltia CMS; ukázka admin/demo běží na Decap CMS, build.py config převádí). Formát JSON je platný YAML.
{
 "backend": {
  "name": "github",
  "repo": "zametouzim/zivyzamek-web",
  "branch": "main"
 },
 "site_url": "https://zametouzim.github.io/zivyzamek-web/",
 "display_url": "https://zametouzim.github.io/zivyzamek-web/",
 "logo_url": "https://zametouzim.github.io/zivyzamek-web/img/logo.png",
 "media_folder": "img/uploads",
 "public_folder": "img/uploads",
 "collections": [
  {
   "name": "akce",
   "label": "Akce",
   "label_singular": "akci",
   "folder": "content/akce",
   "create": true,
   "delete": true,
   "format": "json",
   "extension": "json",
   "slug": "{{fields.date}}-{{slug}}",
   "identifier_field": "title",
   "summary": "{{date | date('D. M. YYYY')}}  ·  {{title}}",
   "sortable_fields": {
    "fields": [
     "date",
     "title"
    ],
    "default": {
     "field": "date",
     "direction": "descending"
    }
   },
   "view_groups": [
    {
     "label": "Rok",
     "field": "date",
     "pattern": "\\d{4}"
    }
   ],
   "description": "Program i archiv akcí. Budoucí akce se samy ukazují v programu, po datu se přesunou do archivu.",
   "fields": [
    {
     "label": "Název akce",
     "name": "title",
     "widget": "string",
     "i18n": true,
     "required": [
      "cs"
     ]
    },
    {
     "label": "Datum",
     "name": "date",
     "widget": "datetime",
     "format": "YYYY-MM-DD",
     "date_format": "D. M. YYYY",
     "time_format": false,
     "picker_utc": true
    },
    {
     "label": "Konec (jen u vícedenních akcí)",
     "name": "end",
     "widget": "datetime",
     "format": "YYYY-MM-DD",
     "date_format": "D. M. YYYY",
     "time_format": false,
     "picker_utc": true,
     "required": false,
     "default": ""
    },
    {
     "label": "Čas",
     "name": "when",
     "widget": "string",
     "required": false,
     "hint": "Např. „sobota · 14:00“ nebo „so 10–16 · ne 10–17“",
     "i18n": true
    },
    {
     "label": "Krátký text na kartičku v programu",
     "name": "short",
     "widget": "string",
     "required": false,
     "hint": "Jedna dvě věty. Ukazuje se jen u nadcházejících akcí.",
     "i18n": true
    },
    {
     "label": "Popis akce",
     "name": "text",
     "widget": "markdown",
     "required": false,
     "buttons": [
      "bold",
      "link"
     ],
     "editor_components": [],
     "modes": [
      "rich_text"
     ],
     "hint": "Každý odstavec na nový řádek.",
     "i18n": true
    },
    {
     "label": "Přeložit automaticky do EN/DE",
     "name": "prelozit",
     "widget": "boolean",
     "required": false,
     "default": true,
     "hint": "Po uložení doplní chybějící angličtinu a němčinu (DeepL). Když je vypnuté, překlad se neudělá a EN/DE můžete napsat sami. Ruční překlady se nikdy nepřepisují. Kredit DeepL: Zbývá 997 590 z 1 000 000 znaků (stav 26. 10. 2026)."
    },
    {
     "label": "Plakát",
     "name": "poster",
     "widget": "image",
     "required": false,
     "media_folder": "/img/plakaty",
     "public_folder": "img/plakaty",
     "choose_url": false
    },
    {
     "label": "Fotky",
     "name": "photos",
     "widget": "list",
     "required": false,
     "collapsed": false,
     "add_to_top": false,
     "field": {
      "label": "Fotka",
      "name": "foto",
      "widget": "image",
      "required": true,
      "media_folder": "/img/akce",
      "public_folder": "img/akce",
      "choose_url": false
     }
    },
    {
     "label": "Štítek",
     "name": "tag",
     "widget": "select",
     "required": false,
     "options": [
      "Pro děti",
      "Přijďte pomoct",
      "Pro všechny"
     ],
     "hint": "Ukazuje se v programu."
    },
    {
     "label": "Rezervace (akce s omezeným počtem míst)",
     "name": "rezervace",
     "widget": "object",
     "required": false,
     "collapsed": true,
     "hint": "Návštěvník vyplní formulář, zaplatí QR platbou (u akce zdarma bez platby) a po spárování platby dostane potvrzení e-mailem. Nezaplacená rezervace po 24 hodinách propadne. Rezervace najdete v Google tabulce Rezervace.",
     "fields": [
      {
       "label": "Zapnout rezervace",
       "name": "zapnuto",
       "widget": "boolean",
       "required": false,
       "default": false
      },
      {
       "label": "Počet míst (když akce nemá termíny)",
       "name": "kapacita",
       "widget": "number",
       "value_type": "int",
       "min": 1,
       "required": false,
       "hint": "Navýšit jde kdykoli, web i rezervace to převezmou zhruba do 10 minut po uložení."
      },
      {
       "label": "Termíny (skupiny)",
       "name": "terminy",
       "widget": "list",
       "required": false,
       "summary": "{{fields.cas}}: {{fields.kapacita}} míst",
       "hint": "Jen když se akce dělí na skupiny, např. prohlídky v 19:00, 20:00 a 21:00. Každý termín má vlastní počet míst a návštěvník si vybere. Počet míst jde kdykoli navýšit.",
       "fields": [
        {
         "label": "Čas nebo název skupiny",
         "name": "cas",
         "widget": "string",
         "hint": "Např. 19:00"
        },
        {
         "label": "Počet míst",
         "name": "kapacita",
         "widget": "number",
         "value_type": "int",
         "min": 1
        }
       ]
      },
      {
       "label": "Uzávěrka rezervací",
       "name": "uzaverka",
       "widget": "datetime",
       "format": "YYYY-MM-DDTHH:mm",
       "date_format": "D. M. YYYY",
       "time_format": "H:mm",
       "required": false,
       "hint": "Do kdy jde rezervovat. Když je prázdné, jde to do začátku dne akce."
      },
      {
       "label": "Ceny",
       "name": "ceny",
       "widget": "list",
       "required": false,
       "summary": "{{fields.druh}}: {{fields.cena}} Kč",
       "hint": "Buď Jednotné vstupné, nebo Dospělí a Děti. Akce zdarma: ceny nechte prázdné. Návštěvník pak zadá jen počet osob a potvrzení dostane hned e-mailem, bez platby.",
       "fields": [
        {
         "label": "Druh vstupného",
         "name": "druh",
         "widget": "select",
         "options": [
          "Dospělí",
          "Děti",
          "Jednotné vstupné"
         ]
        },
        {
         "label": "Cena v Kč za osobu",
         "name": "cena",
         "widget": "number",
         "value_type": "int",
         "min": 0
        }
       ]
      }
     ]
    },
    {
     "label": "Skrytá akce (nezobrazí se v programu ani v archivu, jen přes přímý odkaz)",
     "name": "skryta",
     "widget": "boolean",
     "required": false,
     "default": false,
     "hint": "Pro vyzkoušení rezervací. Odkaz: adresa webu + #akce/ a název souboru akce."
    },
    {
     "label": "Název je jen pracovní (na webu se zobrazí fialová poznámka „název?“)",
     "name": "titleTodo",
     "widget": "boolean",
     "required": false,
     "default": false
    }
   ],
   "editor": {
    "preview": false
   },
   "i18n": true
  },
