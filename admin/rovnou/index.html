<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administrace bez konceptů · Živý zámek Toužim</title>
<link rel="icon" href="../../img/logo.png">
<style>
#prepni{position:fixed;left:8px;bottom:8px;z-index:99999;background:#7b3fc4;color:#fff;font:13px/1.3 system-ui,sans-serif;padding:6px 10px;border-radius:4px;text-decoration:none}
</style>
</head>
<body>
<a id="prepni" href="../">Uložení jde rovnou na web · přepnout na koncepty</a>
<!-- Stejná administrace jako /admin/ (stejné nastavení admin/config.yml), jen bez konceptů: Uložit = hned na web -->
<script>window.CMS_MANUAL_INIT=true;</script>
<script src="https://unpkg.com/@sveltia/cms@0.224.0/dist/sveltia-cms.js"></script>
<script src="../skryta.js"></script>
<script>
fetch('../config.yml',{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
  var c=JSON.parse(t.split('\n').filter(function(l){return l.charAt(0)!=='#'}).join('\n'));
  delete c.publish_mode;
  c.load_config_file=false;
  CMS.init({config:c});
});
</script>
</body>
</html>
